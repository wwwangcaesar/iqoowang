plugins {
    alias(libs.plugins.androidApplication)
}

// 从 local.properties 读高德Key，不把Key直接写进 build.gradle/manifest 里提交到版本控制。
// 只需要在 local.properties 里加一行 AMAP_KEY=你的Key 就能生效，那个文件本身已经被 .gitignore 排除了。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def amapKey = localProps.getProperty('AMAP_KEY', '')

android {
    namespace "com.monsieurmahjong.iqoowang"
    compileSdk 34

    defaultConfig {
        applicationId "com.monsieurmahjong.iqoowang"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        manifestPlaceholders["AMAP_KEY"] = amapKey
        ndk {
            // X5内核仅支持这两个架构，必须明确指定
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
        // 引入 ML Kit 中文识别库 (端侧离线运行)
        implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    // 协程核心依赖（如果尚未添加）
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Gson JSON解析
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // 高德地图/定位/搜索 SDK：官方从某版本起推荐用合并包（地图+定位+搜索三合一）而不是分别引入三个独立包，
    // 避免重复类冲突。之前 Phase 2 单独加的 com.amap.api:location 现在换成这个合并包（已经包含定位能力，
    // 不需要再单独保留）。版本号用 latest.integration 而不是锁死具体版本号，是因为官方文档里给的示例版本号
    // 格式比较特殊（如 10.1.200_loc6.4.9_sea9.7.4），不确定当前时间点的准确最新值，用 latest.integration 让
    // Gradle 自己解析真实可用的最新版本比我猜一个数字更稳妥——个人项目非商业发布场景下这个取舍可以接受，
    // 如果以后想锁版本可以去高德官网下载页查当前具体号换上去。
    implementation 'com.amap.api:3dmap-location-search:latest.integration'

}
