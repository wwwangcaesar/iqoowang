plugins {
    alias(libs.plugins.androidApplication)
}

// 从 local.properties 读高德Key，不把Key直接写进 build.gradle/manifest 里提交到版本控制。
// 只需要在 local.properties 里加一行 AMAP_KEY=你的Key 就能生效，那个文件本身已经被 .gitignore 排除了。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def amapKey = localProps.getProperty('AMAP_KEY', '')

android {
    namespace "com.monsieurmahjong.iqoowang"
    compileSdk 34

    defaultConfig {
        applicationId "com.monsieurmahjong.iqoowang"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        manifestPlaceholders["AMAP_KEY"] = amapKey
        ndk {
            // X5内核仅支持这两个架构，必须明确指定
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
        // 引入 ML Kit 中文识别库 (端侧离线运行)
        implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    // 协程核心依赖（如果尚未添加）
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Gson JSON解析
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // 高德定位 SDK：摇一摇/NFC 记账时自动拿经纬度+地点名称，后续地图导航页面也会复用同一套 SDK
    implementation 'com.amap.api:location:6.5.0'

}
