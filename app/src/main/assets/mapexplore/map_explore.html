<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>消费足迹地图 - 3D科技地球与高德街区图层</title>
<!-- ECharts 5.5.1 & ECharts GL 2.0.9 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
<!-- MuGuiLin/3D-Earth 核心算法库 (本地 assets 零网络极速加载) -->
<script src="./d3-timer.min.js"></script>
<script src="./d3-geo.min.js"></script>
<script src="./d3-contour.min.js"></script>
<!-- 内置离线地球大陆贴图 Base64 (彻底避免 WebView 跨域/白屏) -->
<script src="./earth-bg-base64.js"></script>
<!-- 高德地图 JS API 1.4.x：无需 securityJsCode，Key 完全兼容 -->
<script src="https://webapi.amap.com/maps?v=1.4.15&key=02efb122ff3481185e944e78cfe411be&plugin=AMap.Scale,AMap.ToolBar"></script>
<style>
  :root {
    --primary: #00FFC6;
    --primary-glow: rgba(0, 255, 198, 0.5);
    --accent-blue: #38BDF8;
    --accent-purple: #C084FC;
    --accent-pink: #F472B6;
    --accent-gold: #FBBF24;
    --neon-magenta: #FF007F;
    --bg-dark: #000308;
    --card-bg: rgba(15, 23, 42, 0.94);
    --border-color: rgba(0, 255, 198, 0.32);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg-dark);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: #fff;
  }

  /* 容器与画布 */
  #globeContainer, #mapContainer, #amapDetailLayer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #globeContainer {
    z-index: 2;
    touch-action: pan-x pan-y pinch-zoom;
    background: radial-gradient(circle at 50% 50%, #0d0b28 0%, #040314 70%, #000108 100%);
  }

  #mapContainer {
    z-index: 3;
    background: radial-gradient(circle at 50% 50%, #0b1528 0%, #040812 75%, #000308 100%);
    touch-action: pan-x pan-y pinch-zoom;
  }

  /* 高德地图独立街区图层 */
  #amapDetailLayer {
    z-index: 10;
    background: #060B14;
    display: flex;
    flex-direction: column;
  }

  #amapDetailContainer {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: #060B14;
  }

  .hidden {
    opacity: 0 !important;
    pointer-events: none !important;
    transform: scale(0.94);
  }

  /* 顶部导航栏 / 面包屑 */
  #headerBar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top, 14px));
    pointer-events: none;
  }

  #breadcrumb {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 7px 14px;
    border-radius: 20px;
    pointer-events: auto;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 255, 198, 0.15);
    max-width: 76%;
  }

  .crumb {
    font-size: 13px;
    color: #94A3B8;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }

  .crumb:active {
    color: #fff;
    transform: scale(0.96);
  }

  .crumb.active {
    color: var(--primary);
    font-weight: 700;
    text-shadow: 0 0 10px var(--primary-glow);
  }

  .crumb-sep {
    color: #475569;
    font-size: 11px;
  }

  /* 右侧控制区 */
  #rightControls {
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }

  #levelBadge {
    background: rgba(0, 255, 198, 0.12);
    border: 1px solid var(--primary);
    color: var(--primary);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 12px;
    letter-spacing: 0.5px;
    box-shadow: 0 0 10px rgba(0, 255, 198, 0.2);
  }

  #backBtn {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 16px;
    cursor: pointer;
    display: none;
    transition: all 0.2s ease;
  }

  #backBtn:active {
    background: rgba(0, 255, 198, 0.25);
    border-color: var(--primary);
    transform: scale(0.95);
  }

  /* 底部状态胶囊 / 操作提示 */
  #bottomBar {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    width: 90%;
    max-width: 380px;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  #actionChip {
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(6, 11, 20, 0.95) 100%);
    border: 1px solid rgba(0, 255, 198, 0.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #F1F5F9;
    padding: 11px 22px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65), 0 0 16px rgba(0, 255, 198, 0.3);
    cursor: pointer;
    pointer-events: auto;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    animation: chipFloat 3.5s ease-in-out infinite;
  }

  #actionChip:active {
    transform: scale(0.94);
    border-color: var(--primary);
    box-shadow: 0 0 24px var(--primary-glow);
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--primary);
    animation: pulseRing 1.8s infinite;
  }

  @keyframes pulseRing {
    0% { transform: scale(0.85); opacity: 0.6; }
    50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 18px var(--primary); }
    100% { transform: scale(0.85); opacity: 0.6; }
  }

  @keyframes chipFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* 即时点击光圈波纹 */
  .click-ripple {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    border: 2px solid var(--primary);
    background: radial-gradient(circle, rgba(0, 255, 198, 0.4) 0%, transparent 70%);
    transform: translate(-50%, -50%) scale(0.2);
    animation: rippleExpand 0.55s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  }

  @keyframes rippleExpand {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.2);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(2.8);
    }
  }

  /* Loading 遮罩层 */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 3, 8, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: opacity 0.3s ease, visibility 0.3s;
  }

  #loading.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(0, 255, 198, 0.15);
    border-top: 3px solid var(--primary);
    border-right: 3px solid var(--accent-blue);
    border-bottom: 3px solid var(--neon-magenta);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 20px rgba(0, 255, 198, 0.3);
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loader-text {
    font-size: 13px;
    letter-spacing: 0.8px;
    color: #E2E8F0;
  }

  /* Toast 提示 */
  #toast {
    position: fixed;
    top: 76px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--border-color);
    color: #F8FAFC;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 40;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 点位小气泡卡片 */
  #pointCard {
    position: fixed;
    z-index: 35;
    background: var(--card-bg);
    border: 1px solid var(--primary);
    border-radius: 12px;
    padding: 9px 15px;
    color: #fff;
    font-size: 12px;
    pointer-events: auto;
    transform: translate(-50%, -100%) scale(0.6);
    opacity: 0;
    white-space: nowrap;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 198, 0.25);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #pointCard.show {
    transform: translate(-50%, -120%) scale(1);
    opacity: 1;
  }

  #pointCard .point-title {
    font-weight: 600;
    color: var(--primary);
    font-size: 13px;
    margin-bottom: 2px;
  }

  #pointCard .point-sub {
    color: #94A3B8;
    font-size: 11px;
  }

  /* 区县级专属详情抽屉 (Bottom Sheet) */
  #districtDrawer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 45;
    background: rgba(13, 20, 36, 0.96);
    border-top: 1px solid var(--primary);
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 255, 198, 0.25);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px 24px 0 0;
    padding: 18px 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
    transform: translateY(105%);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #districtDrawer.open {
    transform: translateY(0);
  }

  .drawer-handle {
    width: 36px;
    height: 4px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 2px;
    margin: 0 auto 12px;
  }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .drawer-title-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .drawer-title {
    font-size: 17px;
    font-weight: 700;
    color: #FFF;
  }

  .drawer-code-tag {
    font-size: 11px;
    color: var(--primary);
    background: rgba(0, 255, 198, 0.15);
    border: 1px solid rgba(0, 255, 198, 0.35);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .drawer-close {
    width: 28px;
    height: 28px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #94A3B8;
    cursor: pointer;
  }

  .drawer-close:active {
    background: rgba(255, 255, 255, 0.2);
    color: #FFF;
  }

  .drawer-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .stat-card {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 8px 10px;
    text-align: center;
  }

  .stat-val {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 2px;
  }

  .stat-label {
    font-size: 11px;
    color: #94A3B8;
  }

  .drawer-spot-list {
    max-height: 140px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
    padding-right: 4px;
  }

  .spot-item {
    background: rgba(30, 41, 59, 0.45);
    border: 1px solid rgba(0, 255, 198, 0.2);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .spot-item:active {
    background: rgba(0, 255, 198, 0.15);
    border-color: var(--primary);
  }

  .spot-name {
    font-size: 13px;
    font-weight: 600;
    color: #F8FAFC;
    margin-bottom: 2px;
  }

  .spot-desc {
    font-size: 11px;
    color: #94A3B8;
  }

  .spot-price {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-gold);
  }

  .drawer-actions {
    display: flex;
    gap: 10px;
  }

  .action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, #00FFC6 0%, #00B4D8 100%);
    color: #000308;
    border: none;
    box-shadow: 0 4px 15px rgba(0, 255, 198, 0.35);
  }

  .btn-secondary {
    background: rgba(30, 41, 59, 0.8);
    color: #E2E8F0;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .action-btn:active {
    transform: scale(0.96);
  }

  /* 高德地图详细图层专属覆盖 UI */
  #amapTopBar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top, 14px));
    pointer-events: none;
  }

  .amap-back-btn {
    background: var(--card-bg);
    border: 1px solid var(--primary);
    color: #FFF;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    pointer-events: auto;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  }

  .amap-badge {
    background: rgba(13, 20, 36, 0.9);
    border: 1px solid rgba(0, 255, 198, 0.4);
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 16px;
    pointer-events: auto;
  }

  #amapBottomCard {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    z-index: 15;
    background: rgba(13, 20, 36, 0.95);
    border: 1px solid var(--primary);
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 198, 0.25);
    backdrop-filter: blur(16px);
  }

  .amap-card-title {
    font-size: 15px;
    font-weight: 700;
    color: #FFF;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .amap-card-sub {
    font-size: 12px;
    color: #94A3B8;
    margin-bottom: 12px;
  }

  .amap-card-actions {
    display: flex;
    gap: 8px;
  }

  /* 自定义高德 Marker 样式 */
  .amap-custom-marker {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }

  .marker-pulse {
    position: absolute;
    width: 24px;
    height: 24px;
    background: rgba(0, 255, 198, 0.4);
    border-radius: 50%;
    animation: pulseRing 1.5s infinite;
    top: -2px;
  }

  .marker-pin {
    width: 20px;
    height: 20px;
    background: var(--primary);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    box-shadow: 0 0 10px var(--primary);
    z-index: 2;
  }

  .marker-label {
    margin-top: 4px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--primary);
    color: #FFF;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

  /* 模式切换平滑黑幕 */
  #transitionVeil {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #000308;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  #transitionVeil.show {
    opacity: 1;
    pointer-events: all;
  }
</style>
</head>
<body>

  <!-- Loading 遮罩 -->
  <div id="loading">
    <div class="loader-spinner"></div>
    <div class="loader-text" id="loadingText">初始化 3D 科技地球…</div>
  </div>

  <!-- 3D 地球与 2D 地图图表容器 -->
  <div id="globeContainer"></div>
  <div id="mapContainer" class="hidden"></div>

  <!-- 独立高德地图街区图层 (点击放大聚焦后单独展现) -->
  <div id="amapDetailLayer" class="hidden">
    <div id="amapTopBar">
      <div class="amap-back-btn" onclick="exitAmapDetailLayer()">‹ 返回区县概览</div>
      <div class="amap-badge" id="amapLayerBadge">高德地图 · 高清街区图层</div>
    </div>
    <div id="amapDetailContainer"></div>
    <div id="amapBottomCard">
      <div class="amap-card-title">
        <span id="amapSpotTitle">深圳湾科技生态园</span>
        <span style="color:var(--accent-gold);font-weight:bold;" id="amapSpotPrice">¥ 328.00</span>
      </div>
      <div class="amap-card-sub" id="amapSpotDesc">广东省深圳市南山区 · 2026-08-20 18:30</div>
      <div class="amap-card-actions">
        <div class="action-btn btn-secondary" onclick="triggerNativeAmapRoute()">🚗 原生路线规划</div>
        <div class="action-btn btn-primary" onclick="openExternalMapNav()">🧭 唤起高德导航</div>
      </div>
    </div>
  </div>

  <!-- 顶部状态栏与面包屑 -->
  <div id="headerBar">
    <div id="breadcrumb"></div>
    <div id="rightControls">
      <div id="levelBadge">3D 视角</div>
      <div id="backBtn" onclick="goBack()">‹ 返回</div>
    </div>
  </div>

  <!-- 底部提示与快捷操作胶囊 (唯有点击此处才触发穿梭进入中国地图) -->
  <div id="bottomBar">
    <div id="actionChip" onclick="handleActionChipClick()">
      <div class="pulse-dot"></div>
      <span id="chipText">🚀 点击穿梭进入中国地图</span>
    </div>
  </div>

  <!-- 提示与点位小卡片 -->
  <div id="toast"></div>
  <div id="pointCard"></div>
  <div id="transitionVeil"></div>

  <!-- 区县级专属详情抽屉 (Bottom Sheet) -->
  <div id="districtDrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <div class="drawer-title-box">
        <span class="drawer-title" id="drawerDistrictTitle">南山区</span>
        <span class="drawer-code-tag" id="drawerDistrictCode">440305</span>
      </div>
      <div class="drawer-close" onclick="closeDistrictDrawer()">✕</div>
    </div>
    <div class="drawer-stats">
      <div class="stat-card">
        <div class="stat-val" id="statTotalSpent">¥ 484.50</div>
        <div class="stat-label">消费总额</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statSpotCount">2 处</div>
        <div class="stat-label">足迹坐标</div>
      </div>

// ============================================================================
// 1. MuGuiLin 风格 5 组绚丽大幅度立体磁轨与 3D 跨洋飞线
// ============================================================================

function generate5MagneticRingsAndFlights() {
  const flightLines = [];
  const hubs = GLOBAL_HUBS;
  const origins = [hubs[0], hubs[1], hubs[2]]; // 上海、北京、深圳
  
  origins.forEach(origin => {
    hubs.forEach(dest => {
      if (origin.name !== dest.name) {
        // 生成 3D 空间拱形飞行抛物线（32 个插值点，中点抛向高空）
        const p1 = origin.coord;
        const p2 = dest.coord;
        const pts = [];
        const numPts = 32;
        for (let i = 0; i <= numPts; i++) {
          const t = i / numPts;
          const lng = p1[0] + (p2[0] - p1[0]) * t;
          const lat = p1[1] + (p2[1] - p1[1]) * t;
          const alt = Math.sin(t * Math.PI) * 0.35; // 3D 抛物线高度
          pts.push([lng, lat, alt]);
        }
        flightLines.push({
          coords: pts,
          fromName: origin.name,
          toName: dest.name,
        });
      }
    });
  });

  // 5 组多彩、大幅度立体环形磁场轨道
  const ringConfigs = [
    { inc: 22,  color: '#00FFC6', alt: 0.18, period: 12 }, // 青色近地赤道轨
    { inc: 65,  color: '#C084FC', alt: 0.38, period: 15 }, // 紫色高倾角极轨
    { inc: -48, color: '#FBBF24', alt: 0.28, period: 11 }, // 金色倾斜反向轨
    { inc: 82,  color: '#38BDF8', alt: 0.48, period: 16 }, // 天蓝极大圆极轨
    { inc: -75, color: '#FF007F', alt: 0.32, period: 13 }, // 荧光洋红大交角轨道
  ];

  const magneticSeries = ringConfigs.map((cfg) => {
    const coords = [];
    for (let deg = 0; deg <= 360; deg += 3) {
      const rad = deg * Math.PI / 180;
      const lng = deg > 180 ? deg - 360 : deg;
      const lat = Math.sin(rad) * cfg.inc;
      coords.push([lng, lat, cfg.alt]);
    }
    return {
      type: 'lines3D',
      coordinateSystem: 'globe',
      polyline: true, // 核心！多点闭合环线
      blendMode: 'lighter',
      effect: {
        show: true,
        period: cfg.period, // 11s ~ 16s 慢速巡游
        trailLength: 0.5,
        symbol: 'circle',
        symbolSize: 4.5,
        color: cfg.color,
      },
      lineStyle: {
        color: cfg.color,
        width: 2.0,
        opacity: 0.5,
      },
      data: [{ coords }],
    };
  });

  const flightSeries = {
    type: 'lines3D',
    coordinateSystem: 'globe',
    polyline: true,
    blendMode: 'lighter',
    effect: {
      show: true,
      period: 8,
      trailLength: 0.45,
      symbol: 'circle',
      symbolSize: 4.0,
      color: '#00FFC6',
    },
    lineStyle: {
      color: 'rgba(56, 189, 248, 0.45)',
      width: 1.6,
      opacity: 0.45,
    },
    data: flightLines,
  };

  return { flightSeries, magneticSeries };
}

// ============================================================================
// 2. 动态呼吸 Canvas 引擎 (2秒渐进显现 + 荧光洋红边缘 + 0 白曝 + 0 接缝黑条)
// ============================================================================

let earthDynamicCanvas = null;
let earthDynamicCtx = null;
let d3TimerLoop = null;
let cachedContours = null;
let cachedValues = null;
let cachedImgData = null;

/**
 * 创建高分辨率动态呼吸底图 (1024x512 Canvas)
 * 实时绘制深邃科技夜空底色、深蓝大陆、青色边界、金白色城市光斑，
 * 并在 5.5s 周期内以正弦波缓缓呼出荧光洋红/霓虹紫边缘辉光（2秒渐进亮起再回退），100% 还原原版！
 */
function setupDynamicEarthTexture(onReady) {
  earthDynamicCanvas = document.createElement('canvas');
  earthDynamicCanvas.width = 1024;
  earthDynamicCanvas.height = 512;
  earthDynamicCtx = earthDynamicCanvas.getContext('2d');

  const bgImg = new Image();
  // 优先使用已加载的 Base64 贴图，无则走本地相对路径
  bgImg.src = (typeof EARTH_BG_BASE64 !== 'undefined') ? EARTH_BG_BASE64 : './earth-bg.png';

  bgImg.onload = function() {
    const W = earthDynamicCanvas.width;
    const H = earthDynamicCanvas.height;

    // 获取陆地像素用于 D3 边缘轮廓提取
    const sampleCanvas = document.createElement('canvas');
    sampleCanvas.width = Math.floor(bgImg.width / 4);
    sampleCanvas.height = Math.floor(bgImg.height / 4);
    const sCtx = sampleCanvas.getContext('2d');
    sCtx.drawImage(bgImg, 0, 0, sampleCanvas.width, sampleCanvas.height);
    cachedImgData = sCtx.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height);

    const m = cachedImgData.height;
    const n = cachedImgData.width;
    cachedValues = new Array(n * m);
    for (let j = 0, k = 0; j < m; ++j) {
      for (let i = 0; i < n; ++i, ++k) {
        cachedValues[k] = cachedImgData.data[(k << 2)] / 255;
      }
    }

    const contoursGenerator = d3.contours().size([n, m]).smooth(true);
    const projection = d3.geoIdentity().scale(W / n);
    const pathGenerator = d3.geoPath(projection, earthDynamicCtx);

    // 随机高亮城市光斑坐标
    const citySpots = [];
    GLOBAL_HUBS.forEach(h => {
      const x = ((h.coord[0] + 180) / 360) * W;
      const y = ((90 - h.coord[1]) / 180) * H;
      citySpots.push({ x, y, name: h.name });
    });

    // 核心重绘函数 (60fps 动态渲染到 Canvas)
    function renderFrame(waveFactor, threshold) {
      const ctx = earthDynamicCtx;
      ctx.clearRect(0, 0, W, H);

      // 1. 深邃暗夜大洋背景 (深蓝紫渐变)
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#020512');
      grad.addColorStop(0.5, '#050c24');
      grad.addColorStop(1, '#020512');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 2. 绘制深色陆地板块
      ctx.save();
      ctx.drawImage(bgImg, 0, 0, W, H);
      ctx.restore();

      // 3. 常规常驻青蓝色陆地边界
      ctx.save();
      ctx.lineWidth = 0.8;
      ctx.strokeStyle = 'rgba(0, 195, 255, 0.45)';
      ctx.shadowColor = '#00E5FF';
      ctx.shadowBlur = 4;
      const baseContours = contoursGenerator.thresholds([0.15])(cachedValues);
      baseContours.forEach(d => {
        ctx.beginPath();
        pathGenerator(d);
        ctx.stroke();
      });
      ctx.restore();

      // 4. 【核心】动态 2 秒渐显荧光洋红呼吸灯效 (MuGuiLin 标志性效果)
      if (waveFactor > 0.05) {
        ctx.save();
        ctx.lineWidth = 1.0 + waveFactor * 1.8;
        ctx.strokeStyle = `rgba(255, 0, 127, ${waveFactor * 0.95})`;
        ctx.shadowColor = '#FF007F';
        ctx.shadowBlur = 12 * waveFactor;
        ctx.globalAlpha = waveFactor;

        const dynContours = contoursGenerator.thresholds([0.08 + threshold * 0.4, 0.35 + threshold * 0.3])(cachedValues);
        dynContours.forEach((d, idx) => {
          ctx.beginPath();
          pathGenerator(d);
          ctx.stroke();
          if (idx === 1) {
            ctx.fillStyle = `rgba(255, 0, 127, ${waveFactor * 0.08})`;
            ctx.fill();
          }
        });
        ctx.restore();
      }

      // 5. 城市光斑脉冲 (中心更亮、有的位置暗一点)
      citySpots.forEach((sp, idx) => {
        const spotWave = Math.sin((Date.now() / 800) + idx);
        const radius = 2.0 + Math.max(0, spotWave) * 1.8;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = waveFactor > 0.5 ? '#FFFFFF' : '#00FFC6';
        ctx.shadowColor = waveFactor > 0.5 ? '#FF007F' : '#00FFC6';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      });

      // 触发 ECharts GL 纹理更新
      if (globeChart && state.mode === 'globe') {
        // ECharts GL 会自动复用 Canvas 引用并上传到 GPU
      }
    }

    // 启动 5.5s 周期呼吸定时器 (2 秒由暗到亮、高潮后平滑回退)
    if (d3TimerLoop) d3TimerLoop.stop();
    const cycleTime = 5500;
    d3TimerLoop = d3.timer(function(t) {
      if (state.mode !== 'globe') return;
      const progress = (t % cycleTime) / cycleTime; // 0 ~ 1
      const wave = Math.max(0, Math.sin(progress * Math.PI)); // 0 -> 1 -> 0
      const threshold = (progress * 1.5) % 1;
      renderFrame(wave, threshold);
    });

    renderFrame(0.5, 0.1);
    if (onReady) onReady(earthDynamicCanvas);
  };

  bgImg.onerror = function() {
    // 降级兜底：纯 Canvas 绘制
    if (onReady) onReady(earthDynamicCanvas);
  };
}

function initGlobe() {

// ============================================================================
// 3D 地球手势系统 (纯手势观赏/旋转/缩放，点击地球绝不误切页面)
// ============================================================================
let touchTracker = {
  startX: 0,
  startY: 0,
  startTime: 0,
  isMoved: false,
  isPinching: false,
};

function setupGlobeInteractions() {
  const el = globeContainer;

  el.addEventListener('touchstart', e => {
    if (e.touches.length > 1) {
      touchTracker.isPinching = true;
      return;
    }
    touchTracker.isPinching = false;
    touchTracker.isMoved = false;
    touchTracker.startX = e.touches[0].clientX;
    touchTracker.startY = e.touches[0].clientY;
    touchTracker.startTime = Date.now();
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (touchTracker.isPinching || e.touches.length > 1) {
      touchTracker.isPinching = true;
      return;
    }
    const dx = e.touches[0].clientX - touchTracker.startX;
    const dy = e.touches[0].clientY - touchTracker.startY;
    if (Math.hypot(dx, dy) > 8) {
      touchTracker.isMoved = true;
    }
  }, { passive: true });

  el.addEventListener('touchend', e => {
    if (touchTracker.isPinching) {
      touchTracker.isPinching = false;
      return;
    }
    const elapsed = Date.now() - touchTracker.startTime;
    // 短触仅在手指位置生成触点视觉光圈涟漪，绝不跳转页面
    if (!touchTracker.isMoved && elapsed < 280) {
      const touch = e.changedTouches[0];
      spawnRipple(touch.clientX, touch.clientY);
    }
  }, { passive: true });

  let mouseStartX = 0, mouseStartY = 0, mouseStartTime = 0, mouseMoved = false;
  el.addEventListener('mousedown', e => {
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
    mouseStartTime = Date.now();
    mouseMoved = false;
  });

  el.addEventListener('mousemove', e => {
    if (Math.hypot(e.clientX - mouseStartX, e.clientY - mouseStartY) > 6) {
      mouseMoved = true;
    }
  });

  el.addEventListener('mouseup', e => {
    if (!mouseMoved && (Date.now() - mouseStartTime < 280)) {
      spawnRipple(e.clientX, e.clientY);
    }
  });
}

/** 仅在点击穿梭胶囊时触发：俯冲进入中国地图动画 */
async function triggerFlyIntoChina() {
  if (state.mode !== 'globe' || state.isTransitioning) return;
  state.isTransitioning = true;
  showToast('🎯 正在穿梭进入中国地图…');

  globeChart.setOption({
    globe: {
      viewControl: {
        autoRotate: false,
        distance: 120,
        alpha: 48,
        targetCoord: CHINA_CENTER,
        animation: true,
        animationDurationUpdate: 850,
        animationEasingUpdate: 'cubicIn',
      },
    },
  });

  await sleep(700);

  await withVeil(async () => {
    globeContainer.classList.add('hidden');
    mapContainer.classList.remove('hidden');
    state.mode = 'map';
    state.isTransitioning = false;
    await renderCountryMap();
  });
}

/** 从 2D 地图拉远退回 3D 地球 */

  if (state.mode !== 'map' || state.isTransitioning) return;

/** 打开区县级专属详情抽屉 */
function openDistrictDrawer(dName, dCode, points) {
  const name = dName || state.districtName || '当前区域';
  const code = dCode || state.districtAdcode || '—';
  const provPoints = DEMO_POINTS[state.provinceName] || [];
  const spotList = points || provPoints.filter(p => p.district === name || p.districtAdcode === code);

  drawerDistrictTitleEl.textContent = name;
  drawerDistrictCodeEl.textContent = code;

  let total = 0;
  spotList.forEach(s => {
    const val = parseFloat((s.amount || '0').replace(/[^0-9.]/g, ''));
    if (!isNaN(val)) total += val;
  });
  statTotalSpentEl.textContent = '¥ ' + total.toFixed(2);
  statSpotCountEl.textContent = spotList.length + ' 处';

  // 没有消费记录的地区：不显示放大聚焦和唤起外部地图导航按钮，展示友好提示
  if (spotList.length === 0) {
    drawerSpotListEl.innerHTML = `
      <div style="text-align:center;color:#94A3B8;font-size:13px;padding:24px 0;line-height:1.6;">
        <div style="font-size:24px;margin-bottom:6px;">📍</div>
        该区域暂无消费记录与坐标定位
      </div>
    `;
    if (drawerActionsEl) drawerActionsEl.style.display = 'none';
  } else {
    if (drawerActionsEl) drawerActionsEl.style.display = 'flex';
    drawerSpotListEl.innerHTML = spotList.map((pt) => `
      <div class="spot-item" onclick="openAmapDetailForSpot('${pt.name}', ${pt.lng}, ${pt.lat}, '${pt.amount}', '${pt.cat}', '${pt.time}')">
        <div>
          <div class="spot-name">📍 ${pt.name}</div>
          <div class="spot-desc">${pt.cat || '消费'} · ${pt.time || '近期'}</div>
        </div>
        <div class="spot-price">${pt.amount}</div>
      </div>
    `).join('');
  }

  state.selectedSpot = spotList.length > 0 ? spotList[0] : null;
  districtDrawerEl.classList.add('open');
}

function closeDistrictDrawer() {
  districtDrawerEl.classList.remove('open');
}

// ============================================================================
// 3. 独立高德地图街区图层引擎 (AMap 1.4.x 3D 深度探索)
// ============================================================================

/** 点击“🔍 放大聚焦”：立即关闭抽屉，平滑切换至高德地图街区图层 */
function zoomInCurrentDistrict() {
  closeDistrictDrawer();
  const provPoints = DEMO_POINTS[state.provinceName] || [];
  const districtPoints = provPoints.filter(p => p.district === state.districtName || p.districtAdcode === state.districtAdcode);
  if (districtPoints.length === 0) {
    showToast('该地区暂无消费坐标');
    return;
  }
  const targetSpot = districtPoints[0];
  openAmapDetailLayer(state.districtName, state.districtAdcode, targetSpot, districtPoints);
}

function openAmapDetailForSpot(name, lng, lat, amount, cat, time) {
  closeDistrictDrawer();
  const spot = { name, lng, lat, amount, cat, time };
  state.selectedSpot = spot;
  openAmapDetailLayer(state.districtName, state.districtAdcode, spot);
}

/** 打开高德地图独立街区图层 */
async function openAmapDetailLayer(districtName, districtAdcode, spot, spotList) {
  if (!spot || !spot.lng || !spot.lat) {
    showToast('该地区暂无消费坐标');
    return;
  }

  showToast(`🔍 正在加载 ${districtName || '当前区县'} 高德街区图层…`);

  const provPoints = DEMO_POINTS[state.provinceName] || [];
  const allSpots = spotList || provPoints.filter(p => p.district === districtName || p.districtAdcode === districtAdcode);
  const activeSpot = spot || (allSpots.length > 0 ? allSpots[0] : null);

  if (!activeSpot) {
    showToast('该地区暂无消费坐标');
    return;
  }

  state.selectedSpot = activeSpot;
  updateAmapBottomCard(activeSpot);

  amapLayerBadge.textContent = `${districtName || '区县'} · 高清街区图层`;

  await withVeil(async () => {
    mapContainer.classList.add('hidden');
    headerBarEl.style.display = 'none';
    bottomBar.style.display = 'none';
    amapDetailLayer.classList.remove('hidden');
    state.mode = 'amap';
  });

  // 等待过渡完成容器尺寸稳定后初始化/更新 AMap
  await sleep(100);
  initOrUpdateAmap(activeSpot.lng, activeSpot.lat, allSpots);
}

/** 退出高德街区图层，返回 2D 区县概览 */
async function exitAmapDetailLayer() {
  await withVeil(async () => {
    amapDetailLayer.classList.add('hidden');
    mapContainer.classList.remove('hidden');
    headerBarEl.style.display = 'flex';
    bottomBar.style.display = 'flex';
    state.mode = 'map';
    updateBreadcrumb();
  });
}

/** 初始化或更新 AMap 实例与 Markers */
function initOrUpdateAmap(centerLng, centerLat, spots) {
  if (typeof AMap === 'undefined') {
    showToast('高德地图组件加载中或离线，已为您展示预设坐标');
    return;
  }

  if (!amapInstance) {
    amapInstance = new AMap.Map('amapDetailContainer', {
      zoom: 16,
      center: [centerLng, centerLat],
      mapStyle: 'amap://styles/dark',
      showLabel: true,
    });

    amapInstance.addControl(new AMap.Scale());
    amapInstance.addControl(new AMap.ToolBar({ position: 'RB', liteStyle: true }));
  } else {
    amapInstance.setZoomAndCenter(16, [centerLng, centerLat]);
  }

  setTimeout(() => { if (amapInstance) amapInstance.resize(); }, 300);

  // 清除旧 Markers 并添加当前区县所有消费点 Markers
  if (amapMarkers.length > 0) {
    amapInstance.remove(amapMarkers);
    amapMarkers = [];
  }

  spots.forEach(pt => {
    const markerContent = `
      <div class="amap-custom-marker" onclick="handleAmapMarkerClick('${pt.name}')">
        <div class="marker-pulse"></div>
        <div class="marker-pin">📍</div>
        <div class="marker-label">${pt.name}</div>
      </div>
    `;
    const marker = new AMap.Marker({
      position: [pt.lng, pt.lat],
      content: markerContent,
      offset: new AMap.Pixel(-12, -30),
      title: pt.name,
    });
    amapMarkers.push(marker);
  });

  if (amapMarkers.length > 0) {
    amapInstance.add(amapMarkers);
  }
}

function handleAmapMarkerClick(name) {
  const provPoints = DEMO_POINTS[state.provinceName] || [];
  const found = provPoints.find(p => p.name === name);
  if (found) {
    state.selectedSpot = found;
    updateAmapBottomCard(found);
    if (amapInstance) {
      amapInstance.setZoomAndCenter(16.5, [found.lng, found.lat]);
    }
  }
}

function updateAmapBottomCard(spot) {
  amapSpotTitle.textContent = spot.name || '位置详情';
  amapSpotPrice.textContent = spot.amount || '';
  amapSpotDesc.textContent = `${state.provinceName || ''}${state.cityName || ''}${state.districtName || ''} · ${spot.cat || '消费'} · ${spot.time || ''}`;
}

/** 触发原生 Android LocationMapActivity 路线规划页面 */
function triggerNativeAmapRoute() {
  const spot = state.selectedSpot;
  if (!spot || !spot.lng || !spot.lat) {
    showToast('该地区暂无消费坐标');
    return;
  }
  showToast(`🚗 正在拉起原生高德规划: ${spot.name}`);

  if (window.MapBridge && window.MapBridge.openLocationMap) {
    window.MapBridge.openLocationMap(spot.name, spot.lat, spot.lng);
  } else {
    openExternalMapNav();
  }
}

/** 唤起外部高德地图 App 真实路线导航 */
function openExternalMapNav() {
  const spot = state.selectedSpot;
  if (!spot || !spot.lng || !spot.lat) {
    showToast('该地区暂无消费坐标');
    return;
  }
  showToast(`🧭 正在唤起高德地图导航: ${spot.name}`);

  const amapUrl = `https://uri.amap.com/marker?position=${spot.lng},${spot.lat}&name=${encodeURIComponent(spot.name)}&src=iqoowang&coordinate=gaode&callnative=1`;
  window.open(amapUrl, '_blank');
}

// 导航跳转辅助函数
function goToCountry() {
  if (state.mode === 'map' && state.level !== 'country') renderCountryMap();
}

function goToProvince() {
  if (state.mode === 'map' && (state.level === 'city' || state.level === 'district')) {
    drillIntoProvince(state.provinceName, state.provinceAdcode);
  }
}

function goToCity() {
  if (state.mode === 'map' && state.level === 'district') {
    drillIntoCity(state.cityName, state.cityAdcode);
  }
}

function goBack() {
  if (state.mode === 'globe') return;
  if (state.mode === 'amap') {
    exitAmapDetailLayer();
    return;
  }
  if (state.level === 'district') goToCity();
  else if (state.level === 'city') goToProvince();
  else if (state.level === 'province') goToCountry();
  else if (state.level === 'country') exitToGlobeMode();
}

/** 2D 地图事件绑定 */
function setupMapInteractions() {
  mapChart.on('click', params => {
    if (params.componentType === 'series' && params.seriesType === 'effectScatter') {
      const evt = params.event && params.event.event;
      const x = evt ? evt.clientX : window.innerWidth / 2;
      const y = evt ? evt.clientY : window.innerHeight / 2;
      showPointCard(params.data.name, `金额: ${params.data.amount || '—'} · ${params.data.cat || '消费'}`, x, y);
      state.selectedSpot = params.data;
      if (state.level === 'district') openDistrictDrawer();
      return;
    }

    if (state.level === 'country') {
      const target = DEMO_PROVINCES.find(p => p.name === params.name) || { name: params.name, adcode: params.data && params.data.adcode };
      if (!target.adcode) {
        showToast(`${params.name} 暂无地理编码`);
        return;
      }
      drillIntoProvince(target.name, target.adcode, params.data && params.data.center);
      return;
    }

    if (state.level === 'province') {
      const adcode = params.data && params.data.adcode;
      if (!adcode) {
        showToast(`${params.name} 暂无下一级数据`);
        return;
      }
      drillIntoCity(params.name, adcode, params.data && params.data.center);
      return;
    }

    if (state.level === 'city') {
      const adcode = params.data && params.data.adcode;
      drillIntoDistrict(params.name, adcode, params.data && params.data.center);
      return;
    }
  });

  mapChart.on('georoam', params => {
    if (state.mode === 'map' && state.level === 'country' && !state.isTransitioning) {
      if (params.zoom !== undefined) {
        const currentOption = mapChart.getOption();
        if (currentOption && currentOption.geo && currentOption.geo[0]) {
          const currentZoom = currentOption.geo[0].zoom;
          if (currentZoom < 0.55) {
            exitToGlobeMode();
          }
        }
      }
    }
  });
}

// 窗口尺寸自适应
window.addEventListener('resize', () => {
  if (globeChart) globeChart.resize();
  if (mapChart) mapChart.resize();
});

// 初始化启动
window.addEventListener('DOMContentLoaded', () => {
  initGlobe();
  setupGlobeInteractions();
  setLoading(false);
});
</script>
