<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>消费足迹地图 - 3D科技地球与高德街区图层</title>
<!-- ECharts 5.5.1 & ECharts GL 2.0.9 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
<!-- 高德地图 JS API 1.4.x：不需要 securityJsCode，与本项目 Key 完全兼容 -->
<script src="https://webapi.amap.com/maps?v=1.4.15&key=02efb122ff3481185e944e78cfe411be&plugin=AMap.Scale,AMap.ToolBar"></script>
<style>
  :root {
    --primary: #00FFC6;
    --primary-glow: rgba(0, 255, 198, 0.5);
    --accent-blue: #38BDF8;
    --accent-purple: #C084FC;
    --accent-pink: #F472B6;
    --accent-gold: #FBBF24;
    --bg-dark: #000308;
    --card-bg: rgba(15, 23, 42, 0.94);
    --border-color: rgba(0, 255, 198, 0.32);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg-dark);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: #fff;
  }

  /* 容器与画布 */
  #globeContainer, #mapContainer, #amapDetailLayer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #globeContainer {
    z-index: 2;
    touch-action: pan-x pan-y pinch-zoom;
  }

  #mapContainer {
    z-index: 3;
    background: radial-gradient(circle at 50% 50%, #0b1528 0%, #040812 75%, #000308 100%);
    touch-action: pan-x pan-y pinch-zoom;
  }

  /* 高德地图独立街区图层 */
  #amapDetailLayer {
    z-index: 10;
    background: #060B14;
    display: flex;
    flex-direction: column;
  }

  #amapDetailContainer {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: #060B14;
  }

  .hidden {
    opacity: 0 !important;
    pointer-events: none !important;
    transform: scale(0.94);
  }

  /* 顶部导航栏 / 面包屑 */
  #headerBar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top, 14px));
    pointer-events: none;
  }

  #breadcrumb {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 7px 14px;
    border-radius: 20px;
    pointer-events: auto;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 255, 198, 0.15);
    max-width: 76%;
  }

  .crumb {
    font-size: 13px;
    color: #94A3B8;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }

  .crumb:active {
    color: #fff;
    transform: scale(0.96);
  }

  .crumb.active {
    color: var(--primary);
    font-weight: 700;
    text-shadow: 0 0 10px var(--primary-glow);
  }

  .crumb-sep {
    color: #475569;
    font-size: 11px;
  }

  /* 右侧控制区 */
  #rightControls {
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }

  #levelBadge {
    background: rgba(0, 255, 198, 0.12);
    border: 1px solid var(--primary);
    color: var(--primary);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 12px;
    letter-spacing: 0.5px;
    box-shadow: 0 0 10px rgba(0, 255, 198, 0.2);
  }

  #backBtn {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 16px;
    cursor: pointer;
    display: none;
    transition: all 0.2s ease;
  }

  #backBtn:active {
    background: rgba(0, 255, 198, 0.25);
    border-color: var(--primary);
    transform: scale(0.95);
  }

  /* 底部状态胶囊 / 操作提示 */
  #bottomBar {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    width: 90%;
    max-width: 380px;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  #actionChip {
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(0, 255, 198, 0.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #F1F5F9;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 16px rgba(0, 255, 198, 0.25);
    cursor: pointer;
    pointer-events: auto;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    animation: chipFloat 3.5s ease-in-out infinite;
  }

  #actionChip:active {
    transform: scale(0.94);
    border-color: var(--primary);
    box-shadow: 0 0 24px var(--primary-glow);
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--primary);
    animation: pulseRing 1.8s infinite;
  }

  @keyframes pulseRing {
    0% { transform: scale(0.85); opacity: 0.6; }
    50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 18px var(--primary); }
    100% { transform: scale(0.85); opacity: 0.6; }
  }

  @keyframes chipFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  /* 即时点击光圈波纹 */
  .click-ripple {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    border: 2px solid var(--primary);
    background: radial-gradient(circle, rgba(0, 255, 198, 0.4) 0%, transparent 70%);
    transform: translate(-50%, -50%) scale(0.2);
    animation: rippleExpand 0.55s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  }

  @keyframes rippleExpand {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.2);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(2.8);
    }
  }

  /* Loading 遮罩层 */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 3, 8, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: opacity 0.3s ease, visibility 0.3s;
  }

  #loading.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(0, 255, 198, 0.15);
    border-top: 3px solid var(--primary);
    border-right: 3px solid var(--accent-blue);
    border-bottom: 3px solid var(--accent-purple);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 20px rgba(0, 255, 198, 0.3);
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loader-text {
    font-size: 13px;
    letter-spacing: 0.8px;
    color: #E2E8F0;
  }

  /* Toast 提示 */
  #toast {
    position: fixed;
    top: 76px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--border-color);
    color: #F8FAFC;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 40;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 点位小气泡卡片 */
  #pointCard {
    position: fixed;
    z-index: 35;
    background: var(--card-bg);
    border: 1px solid var(--primary);
    border-radius: 12px;
    padding: 9px 15px;
    color: #fff;
    font-size: 12px;
    pointer-events: auto;
    transform: translate(-50%, -100%) scale(0.6);
    opacity: 0;
    white-space: nowrap;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 198, 0.25);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #pointCard.show {
    transform: translate(-50%, -120%) scale(1);
    opacity: 1;
  }

  #pointCard .point-title {
    font-weight: 600;
    color: var(--primary);
    font-size: 13px;
    margin-bottom: 2px;
  }

  #pointCard .point-sub {
    color: #94A3B8;
    font-size: 11px;
  }

  /* 区县级专属详情抽屉 (Bottom Sheet) */
  #districtDrawer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 45;
    background: rgba(13, 20, 36, 0.96);
    border-top: 1px solid var(--primary);
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 255, 198, 0.25);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px 24px 0 0;
    padding: 18px 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
    transform: translateY(105%);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #districtDrawer.open {
    transform: translateY(0);
  }

  .drawer-handle {
    width: 36px;
    height: 4px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 2px;
    margin: 0 auto 12px;
  }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .drawer-title-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .drawer-title {
    font-size: 17px;
    font-weight: 700;
    color: #FFF;
  }

  .drawer-code-tag {
    font-size: 11px;
    color: var(--primary);
    background: rgba(0, 255, 198, 0.15);
    border: 1px solid rgba(0, 255, 198, 0.35);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .drawer-close {
    width: 28px;
    height: 28px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #94A3B8;
    cursor: pointer;
  }

  .drawer-close:active {
    background: rgba(255, 255, 255, 0.2);
    color: #FFF;
  }

  .drawer-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .stat-card {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 8px 10px;
    text-align: center;
  }

  .stat-val {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 2px;
  }

  .stat-label {
    font-size: 11px;
    color: #94A3B8;
  }

  .drawer-spot-list {
    max-height: 140px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
    padding-right: 4px;
  }

  .spot-item {
    background: rgba(30, 41, 59, 0.45);
    border: 1px solid rgba(0, 255, 198, 0.2);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .spot-item:active {
    background: rgba(0, 255, 198, 0.15);
    border-color: var(--primary);
  }

  .spot-name {
    font-size: 13px;
    font-weight: 600;
    color: #F8FAFC;
    margin-bottom: 2px;
  }

  .spot-desc {
    font-size: 11px;
    color: #94A3B8;
  }

  .spot-price {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-gold);
  }

  .drawer-actions {
    display: flex;
    gap: 10px;
  }

  .action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, #00FFC6 0%, #00B4D8 100%);
    color: #000308;
    border: none;
    box-shadow: 0 4px 15px rgba(0, 255, 198, 0.35);
  }

  .btn-secondary {
    background: rgba(30, 41, 59, 0.8);
    color: #E2E8F0;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .action-btn:active {
    transform: scale(0.96);
  }

  /* 高德地图详细图层专属覆盖 UI */
  #amapTopBar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top, 14px));
    pointer-events: none;
  }

  .amap-back-btn {
    background: var(--card-bg);
    border: 1px solid var(--primary);
    color: #FFF;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    pointer-events: auto;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  }

  .amap-badge {
    background: rgba(13, 20, 36, 0.9);
    border: 1px solid rgba(0, 255, 198, 0.4);
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 16px;
    pointer-events: auto;
  }

  #amapBottomCard {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: max(20px, env(safe-area-inset-bottom, 20px));
    z-index: 15;
    background: rgba(13, 20, 36, 0.95);
    border: 1px solid var(--primary);
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 198, 0.25);
    backdrop-filter: blur(16px);
  }

  .amap-card-title {
    font-size: 15px;
    font-weight: 700;
    color: #FFF;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .amap-card-sub {
    font-size: 12px;
    color: #94A3B8;
    margin-bottom: 12px;
  }

  .amap-card-actions {
    display: flex;
    gap: 8px;
  }

  /* 自定义高德 Marker 样式 */
  .amap-custom-marker {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }

  .marker-pulse {
    position: absolute;
    width: 24px;
    height: 24px;
    background: rgba(0, 255, 198, 0.4);
    border-radius: 50%;
    animation: pulseRing 1.5s infinite;
    top: -2px;
  }

  .marker-pin {
    width: 20px;
    height: 20px;
    background: var(--primary);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    box-shadow: 0 0 10px var(--primary);
    z-index: 2;
  }

  .marker-label {
    margin-top: 4px;
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--primary);
    color: #FFF;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

  /* 模式切换平滑黑幕 */
  #transitionVeil {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #000308;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  #transitionVeil.show {
    opacity: 1;
    pointer-events: all;
  }
</style>
</head>
<body>

  <!-- Loading 遮罩 -->
  <div id="loading">
    <div class="loader-spinner"></div>
    <div class="loader-text" id="loadingText">初始化 3D 科技地球…</div>
  </div>

  <!-- 3D 地球与 2D 地图图表容器 -->
  <div id="globeContainer"></div>
  <div id="mapContainer" class="hidden"></div>

  <!-- 独立高德地图街区图层 (点击放大聚焦后单独展现) -->
  <div id="amapDetailLayer" class="hidden">
    <div id="amapTopBar">
      <div class="amap-back-btn" onclick="exitAmapDetailLayer()">‹ 返回区县概览</div>
      <div class="amap-badge" id="amapLayerBadge">高德地图 · 高清街区图层</div>
    </div>
    <div id="amapDetailContainer"></div>
    <div id="amapBottomCard">
      <div class="amap-card-title">
        <span id="amapSpotTitle">深圳湾科技生态园</span>
        <span style="color:var(--accent-gold);font-weight:bold;" id="amapSpotPrice">¥ 328.00</span>
      </div>
      <div class="amap-card-sub" id="amapSpotDesc">广东省深圳市南山区 · 2026-08-20 18:30</div>
      <div class="amap-card-actions">
        <div class="action-btn btn-secondary" onclick="triggerNativeAmapRoute()">🚗 原生路线规划</div>
        <div class="action-btn btn-primary" onclick="openExternalMapNav()">🧭 唤起高德导航</div>
      </div>
    </div>
  </div>

  <!-- 顶部状态栏与面包屑 -->
  <div id="headerBar">
    <div id="breadcrumb"></div>
    <div id="rightControls">
      <div id="levelBadge">3D 视角</div>
      <div id="backBtn" onclick="goBack()">‹ 返回</div>
    </div>
  </div>

  <!-- 底部提示与快捷操作胶囊 -->
  <div id="bottomBar">
    <div id="actionChip" onclick="handleActionChipClick()">
      <div class="pulse-dot"></div>
      <span id="chipText">点击地球或此处，穿梭进入中国地图</span>
    </div>
  </div>

  <!-- 提示与点位小卡片 -->
  <div id="toast"></div>
  <div id="pointCard"></div>
  <div id="transitionVeil"></div>

  <!-- 区县级专属详情抽屉 (Bottom Sheet) -->
  <div id="districtDrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <div class="drawer-title-box">
        <span class="drawer-title" id="drawerDistrictTitle">南山区</span>
        <span class="drawer-code-tag" id="drawerDistrictCode">440305</span>
      </div>
      <div class="drawer-close" onclick="closeDistrictDrawer()">✕</div>
    </div>
    <div class="drawer-stats">
      <div class="stat-card">
        <div class="stat-val" id="statTotalSpent">¥ 484.50</div>
        <div class="stat-label">消费总额</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statSpotCount">2 处</div>
        <div class="stat-label">足迹坐标</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statFreq">高频</div>
        <div class="stat-label">热度评级</div>
      </div>
    </div>
    <div class="drawer-spot-list" id="drawerSpotList">
      <!-- 动态生成足迹点列表 -->
    </div>
    <div class="drawer-actions">
      <div class="action-btn btn-secondary" onclick="zoomInCurrentDistrict()">🔍 放大聚焦</div>
      <div class="action-btn btn-primary" onclick="openExternalMapNav()">🧭 唤起外部地图导航</div>
    </div>
  </div>

<script>
/**
 * ============================================================================
 * 消费足迹地图：3D 炫酷地球 + 2D 省市区县多级下钻 + 高德街区专属详情图层

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

function setLoading(show, text) {

function spawnRipple(x, y) {
  const ripple = document.createElement('div');
  ripple.className = 'click-ripple';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

}

async function fetchGeo(adcode) {
  if (geoCache[adcode]) return geoCache[adcode];
  const url = `${DATAV_BASE}${adcode}_full.json`;
  const resp = await fetch(url);
  if (!resp.ok) {
    const fallbackUrl = `${DATAV_BASE}${adcode}.json`;
    const fallbackResp = await fetch(fallbackUrl);
    if (!fallbackResp.ok) throw new Error(`地图数据获取失败: ${adcode}`);
    const json = await fallbackResp.json();
    geoCache[adcode] = json;
    return json;
  }
  const json = await resp.json();
  geoCache[adcode] = json;
  return json;
}

// ============================================================================
// 1. 3D 炫酷地球引擎 (MuGuiLin/3D-Earth 多彩大幅度磁场光轨 + 慢速流光粒子)
// ============================================================================

function generateMuGuiLinGlobeLines() {
  const flightLines = [];
  const hubs = GLOBAL_HUBS;
  const origins = [hubs[0], hubs[1], hubs[2]]; // 北京、上海、深圳
  
  origins.forEach(origin => {
    hubs.forEach(dest => {
      if (origin.name !== dest.name) {
        const p1 = origin.coord;
        const p2 = dest.coord;
        const pts = [];
        const numPts = 32;
        for (let i = 0; i <= numPts; i++) {
          const t = i / numPts;
          const lng = p1[0] + (p2[0] - p1[0]) * t;
          const lat = p1[1] + (p2[1] - p1[1]) * t;
          const alt = Math.sin(t * Math.PI) * 0.35;
          pts.push([lng, lat, alt]);
        }
        flightLines.push({
          coords: pts,
          fromName: origin.name,
          toName: dest.name,
        });
      }
    });
  });

  const ringConfigs = [
    { inc: 20,  color: '#00FFC6', alt: 0.18, period: 12 },
    { inc: 60,  color: '#C084FC', alt: 0.38, period: 15 },
    { inc: -45, color: '#FBBF24', alt: 0.28, period: 11 },
    { inc: 80,  color: '#38BDF8', alt: 0.48, period: 16 },
    { inc: -75, color: '#F472B6', alt: 0.32, period: 13 },
  ];

  const magneticSeries = ringConfigs.map((cfg) => {
    const coords = [];
    for (let deg = 0; deg <= 360; deg += 3) {
      const rad = deg * Math.PI / 180;
      const lng = deg > 180 ? deg - 360 : deg;
      const lat = Math.sin(rad) * cfg.inc;
      coords.push([lng, lat, cfg.alt]);
    }
    return {
      type: 'lines3D',
      coordinateSystem: 'globe',
      polyline: true,
      blendMode: 'lighter',
      effect: {
        show: true,
        period: cfg.period,
        trailLength: 0.5,
        symbol: 'circle',
        symbolSize: 4.2,
        color: cfg.color,
      },
      lineStyle: {
        color: cfg.color,
        width: 1.8,
        opacity: 0.45,
      },
      data: [{ coords }],
    };
  });

  const flightSeries = {
    type: 'lines3D',
    coordinateSystem: 'globe',
    polyline: true,
    blendMode: 'lighter',
    effect: {
      show: true,
      period: 10,
      trailLength: 0.45,
      symbol: 'circle',
      symbolSize: 3.8,
      color: '#00FFC6',
    },
    lineStyle: {
      color: 'rgba(56, 189, 248, 0.5)',
      width: 1.6,
      opacity: 0.5,
    },
    data: flightLines,
  };

  return { flightSeries, magneticSeries };
}

/** 大陆板块微光呼吸动效（忽明忽暗） */
function startContinentBreathing() {
  if (globePulseTimer) clearInterval(globePulseTimer);
  let step = 0;
  globePulseTimer = setInterval(() => {
    if (state.mode !== 'globe' || !globeChart) return;
    step += 0.1;
    const baseOpacity = 0.55 + Math.sin(step) * 0.35;
    const baseSize = 5 + Math.sin(step) * 2.8;
    
    globeChart.setOption({
      series: [{
        id: 'continentScatter',
        symbolSize: baseSize,
        itemStyle: { opacity: baseOpacity },
      }],
    });
  }, 100);
}

function stopContinentBreathing() {
  if (globePulseTimer) {
    clearInterval(globePulseTimer);
    globePulseTimer = null;
  }
}

// 3D 地球手势与点击判定系统
// ============================================================================
let touchTracker = {
  startX: 0,
  startY: 0,
  startTime: 0,
  isMoved: false,
  isPinching: false,
};

function setupGlobeInteractions() {
  const el = globeContainer;

  el.addEventListener('touchstart', e => {
    if (e.touches.length > 1) {
      touchTracker.isPinching = true;
      return;
    }
    touchTracker.isPinching = false;
    touchTracker.isMoved = false;
    touchTracker.startX = e.touches[0].clientX;
    touchTracker.startY = e.touches[0].clientY;
    touchTracker.startTime = Date.now();
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (touchTracker.isPinching || e.touches.length > 1) {
      touchTracker.isPinching = true;
      return;
    }
    const dx = e.touches[0].clientX - touchTracker.startX;
    const dy = e.touches[0].clientY - touchTracker.startY;
    if (Math.hypot(dx, dy) > 8) {
      touchTracker.isMoved = true;
    }
  }, { passive: true });

  el.addEventListener('touchend', e => {
    if (touchTracker.isPinching) {
      touchTracker.isPinching = false;
      return;
    }
    if (state.mode !== 'globe' || state.isTransitioning) return;
    const elapsed = Date.now() - touchTracker.startTime;
    if (!touchTracker.isMoved && elapsed < 280) {
      const touch = e.changedTouches[0];
      spawnRipple(touch.clientX, touch.clientY);
      triggerFlyIntoChina();
    }
  }, { passive: true });

  let mouseStartX = 0, mouseStartY = 0, mouseStartTime = 0, mouseMoved = false;
  el.addEventListener('mousedown', e => {
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
    mouseStartTime = Date.now();
    mouseMoved = false;
  });

  el.addEventListener('mousemove', e => {
    if (Math.hypot(e.clientX - mouseStartX, e.clientY - mouseStartY) > 6) {
      mouseMoved = true;
    }
  });

  el.addEventListener('mouseup', e => {
    if (state.mode !== 'globe' || state.isTransitioning) return;
    if (!mouseMoved && (Date.now() - mouseStartTime < 280)) {
      spawnRipple(e.clientX, e.clientY);
      triggerFlyIntoChina();
    }
  });
}

/** 俯冲进入中国地图动画 */
async function triggerFlyIntoChina() {
  if (state.mode !== 'globe' || state.isTransitioning) return;
  state.isTransitioning = true;
  showToast('🎯 正在穿梭进入中国地图…');

  globeChart.setOption({
    globe: {
      viewControl: {
        autoRotate: false,
        distance: 120,
        alpha: 48,
        targetCoord: CHINA_CENTER,
        animation: true,
        animationDurationUpdate: 850,
        animationEasingUpdate: 'cubicIn',
      },
    },
  });

  await sleep(700);

  await withVeil(async () => {
    globeContainer.classList.add('hidden');
    mapContainer.classList.remove('hidden');
    stopContinentBreathing();
    state.mode = 'map';
    state.isTransitioning = false;
    await renderCountryMap();
  });
}

/** 从 2D 地图拉远退回 3D 地球 */

  if (state.mode !== 'map' || state.isTransitioning) return;
  state.isTransitioning = true;
  closeDistrictDrawer();

    mapContainer.classList.add('hidden');
    globeContainer.classList.remove('hidden');

    state.level = 'country';
    updateBreadcrumb();

        animation: true,
        animationDurationUpdate: 900,

  state.isTransitioning = false;
}

/** 打开区县级专属详情抽屉 */
function openDistrictDrawer(dName, dCode, points) {
  const name = dName || state.districtName || '当前区域';
  const code = dCode || state.districtAdcode || '—';
  const provPoints = DEMO_POINTS[state.provinceName] || [];
  const spotList = points || provPoints.filter(p => p.district === name || p.districtAdcode === code);

  drawerDistrictTitleEl.textContent = name;
  drawerDistrictCodeEl.textContent = code;

  let total = 0;
  spotList.forEach(s => {
    const val = parseFloat((s.amount || '0').replace(/[^0-9.]/g, ''));
    if (!isNaN(val)) total += val;
  });
  statTotalSpentEl.textContent = '¥ ' + total.toFixed(2);
  statSpotCountEl.textContent = spotList.length + ' 处';

  if (spotList.length === 0) {
    drawerSpotListEl.innerHTML = `
      <div style="text-align:center;color:#64748B;font-size:12px;padding:16px 0;">
        该区县暂无预设消费记录，点击下方“放大聚焦”可打开高德街区图层探索
      </div>
    `;
  } else {
    drawerSpotListEl.innerHTML = spotList.map((pt) => `
      <div class="spot-item" onclick="openAmapDetailForSpot('${pt.name}', ${pt.lng}, ${pt.lat}, '${pt.amount}', '${pt.cat}', '${pt.time}')">
        <div>
          <div class="spot-name">📍 ${pt.name}</div>
          <div class="spot-desc">${pt.cat || '消费'} · ${pt.time || '近期'}</div>
        </div>
        <div class="spot-price">${pt.amount}</div>
      </div>
    `).join('');
  }

  state.selectedSpot = spotList.length > 0 ? spotList[0] : null;
  districtDrawerEl.classList.add('open');
}

function closeDistrictDrawer() {
  districtDrawerEl.classList.remove('open');
}

// 3. 独立高德地图街区图层引擎 (AMap 2.0 3D 深度探索)
// ============================================================================

/** 点击“🔍 放大聚焦”：立即关闭抽屉，平滑切换至高德地图街区图层 */
function zoomInCurrentDistrict() {
  closeDistrictDrawer();
  const provPoints = DEMO_POINTS[state.provinceName] || [];
  const districtPoints = provPoints.filter(p => p.district === state.districtName || p.districtAdcode === state.districtAdcode);
  const targetSpot = districtPoints.length > 0 ? districtPoints[0] : null;

  openAmapDetailLayer(state.districtName, state.districtAdcode, targetSpot, districtPoints);
}

function openAmapDetailForSpot(name, lng, lat, amount, cat, time) {
  closeDistrictDrawer();
  const spot = { name, lng, lat, amount, cat, time };
  state.selectedSpot = spot;
  openAmapDetailLayer(state.districtName, state.districtAdcode, spot);
}

/** 打开高德地图独立街区图层 */
async function openAmapDetailLayer(districtName, districtAdcode, spot, spotList) {
  showToast(`🔍 正在加载 ${districtName || '当前区县'} 高德街区图层…`);

  const provPoints = DEMO_POINTS[state.provinceName] || [];
  const allSpots = spotList || provPoints.filter(p => p.district === districtName || p.districtAdcode === districtAdcode);
  const activeSpot = spot || (allSpots.length > 0 ? allSpots[0] : { name: districtName, lng: 113.9488, lat: 22.5288, amount: '—', cat: '区县中心', time: '现在' });

  state.selectedSpot = activeSpot;
  updateAmapBottomCard(activeSpot);

  amapLayerBadge.textContent = `${districtName || '区县'} · 高清街区图层`;

  await withVeil(async () => {
    mapContainer.classList.add('hidden');
    headerBarEl.style.display = 'none';
    bottomBar.style.display = 'none';
    amapDetailLayer.classList.remove('hidden');
    state.mode = 'amap';
  });

  // 等过渡完成后再初始化/更新 AMap，确保容器尺寸已经确立
  await sleep(100);
  initOrUpdateAmap(activeSpot.lng, activeSpot.lat, allSpots);
}

/** 退出高德街区图层，返回 2D 区县概览 */
async function exitAmapDetailLayer() {
  await withVeil(async () => {
    amapDetailLayer.classList.add('hidden');
    mapContainer.classList.remove('hidden');
    headerBarEl.style.display = 'flex';
    bottomBar.style.display = 'flex';
    state.mode = 'map';
    updateBreadcrumb();
  });
}

/** 初始化或更新 AMap 实例与 Markers */
function initOrUpdateAmap(centerLng, centerLat, spots) {
  if (typeof AMap === 'undefined') {
    showToast('高德地图组件加载中或离线，已为您展示预设坐标');
    return;
  }

  if (!amapInstance) {
    amapInstance = new AMap.Map('amapDetailContainer', {
      zoom: 16,
      center: [centerLng, centerLat],
      mapStyle: 'amap://styles/dark', // 暗夜底图，1.4.x 支持
      showLabel: true,
    });

    amapInstance.addControl(new AMap.Scale());
    amapInstance.addControl(new AMap.ToolBar({ position: 'RB', liteStyle: true }));
  } else {
    amapInstance.setZoomAndCenter(16, [centerLng, centerLat]);
  }

  // 容器在展示后可能刚完成 CSS 过渡，强制触发一次 resize 确保瓦片正确铺满
  setTimeout(() => { if (amapInstance) amapInstance.resize(); }, 300);


  // 清除旧 Markers 并添加当前区县所有消费点 Markers
  if (amapMarkers.length > 0) {
    amapInstance.remove(amapMarkers);
    amapMarkers = [];
  }

  spots.forEach(pt => {
    const markerContent = `
      <div class="amap-custom-marker" onclick="handleAmapMarkerClick('${pt.name}')">
        <div class="marker-pulse"></div>
        <div class="marker-pin">📍</div>
        <div class="marker-label">${pt.name}</div>
      </div>
    `;
    const marker = new AMap.Marker({
      position: [pt.lng, pt.lat],
      content: markerContent,
      offset: new AMap.Pixel(-12, -30),
      title: pt.name,
    });
    amapMarkers.push(marker);
  });

  if (amapMarkers.length > 0) {
    amapInstance.add(amapMarkers);
  }
}

function handleAmapMarkerClick(name) {
  const provPoints = DEMO_POINTS[state.provinceName] || [];
  const found = provPoints.find(p => p.name === name);
  if (found) {
    state.selectedSpot = found;
    updateAmapBottomCard(found);
    if (amapInstance) {
      amapInstance.setZoomAndCenter(16.5, [found.lng, found.lat], false, 500);
    }
  }
}

function updateAmapBottomCard(spot) {
  amapSpotTitle.textContent = spot.name || '位置详情';
  amapSpotPrice.textContent = spot.amount || '';
  amapSpotDesc.textContent = `${state.provinceName || ''}${state.cityName || ''}${state.districtName || ''} · ${spot.cat || '消费'} · ${spot.time || ''}`;
}

/** 触发原生 Android LocationMapActivity 路线规划页面 */
function triggerNativeAmapRoute() {
  const spot = state.selectedSpot || { name: '目标位置', lng: 113.9488, lat: 22.5288 };
  showToast(`🚗 正在拉起原生高德规划: ${spot.name}`);

  if (window.MapBridge && window.MapBridge.openLocationMap) {
    window.MapBridge.openLocationMap(spot.name, spot.lat, spot.lng);
  } else {
    // 降级为外部唤起
    openExternalMapNav();
  }
}

/** 唤起外部高德地图 App 真实路线导航 */
function openExternalMapNav() {
  const spot = state.selectedSpot || { name: state.districtName || '目标区域', lng: 113.9488, lat: 22.5288 };
  showToast(`🧭 正在唤起高德地图导航: ${spot.name}`);

  const amapUrl = `https://uri.amap.com/marker?position=${spot.lng},${spot.lat}&name=${encodeURIComponent(spot.name)}&src=iqoowang&coordinate=gaode&callnative=1`;
  window.open(amapUrl, '_blank');
}

function goToCity() {
  if (state.mode === 'map' && state.level === 'district') {
    drillIntoCity(state.cityName, state.cityAdcode);
  }
}

function goBack() {
  if (state.mode === 'globe') return;
  if (state.mode === 'amap') {
    exitAmapDetailLayer();
    return;
  }
  if (state.level === 'district') goToCity();
  else if (state.level === 'city') goToProvince();
  else if (state.level === 'province') goToCountry();
  else if (state.level === 'country') exitToGlobeMode();
}

/** 2D 地图事件绑定 */
function setupMapInteractions() {
  mapChart.on('click', params => {
    if (params.componentType === 'series' && params.seriesType === 'effectScatter') {
      const evt = params.event && params.event.event;
      const x = evt ? evt.clientX : window.innerWidth / 2;
      const y = evt ? evt.clientY : window.innerHeight / 2;
      showPointCard(params.data.name, `金额: ${params.data.amount || '—'} · ${params.data.cat || '消费'}`, x, y);
      state.selectedSpot = params.data;
      if (state.level === 'district') openDistrictDrawer();
      return;
    }

    if (state.level === 'country') {
      const target = DEMO_PROVINCES.find(p => p.name === params.name) || { name: params.name, adcode: params.data && params.data.adcode };
      if (!target.adcode) {
        showToast(`${params.name} 暂无地理编码`);
        return;
      }
      drillIntoProvince(target.name, target.adcode, params.data && params.data.center);
      return;
    }

    if (state.level === 'province') {
      const adcode = params.data && params.data.adcode;
      if (!adcode) {
        showToast(`${params.name} 暂无下一级数据`);
        return;
      }
      drillIntoCity(params.name, adcode, params.data && params.data.center);
      return;
    }

    if (state.level === 'city') {
      const adcode = params.data && params.data.adcode;
      drillIntoDistrict(params.name, adcode, params.data && params.data.center);
      return;
    }
  });

  mapChart.on('georoam', params => {
    if (state.mode === 'map' && state.level === 'country' && !state.isTransitioning) {
      if (params.zoom !== undefined) {
        const currentOption = mapChart.getOption();
        if (currentOption && currentOption.geo && currentOption.geo[0]) {
          const currentZoom = currentOption.geo[0].zoom;
          if (currentZoom < 0.55) {
            exitToGlobeMode();
          }
        }
      }
    }
  });
}

// 窗口尺寸自适应
window.addEventListener('resize', () => {
  if (globeChart) globeChart.resize();
  if (mapChart) mapChart.resize();
});

// 初始化启动
window.addEventListener('DOMContentLoaded', () => {
  initGlobe();
  setupGlobeInteractions();
  setLoading(false);
});
</script>
