<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>消费足迹地图</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#000308; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; }

  #globeChart, #mapChart { position:fixed; inset:0; width:100%; height:100%; }
  #mapChart { background:#0A0E17; }
  .hidden { visibility:hidden; pointer-events:none; }

  #enterHint { position:fixed; bottom:56px; left:50%; transform:translateX(-50%); z-index:12;
    color:#8fb8ff; font-size:13px; text-align:center; opacity:.85;
    animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.5;} 50%{opacity:.95;} }

  #breadcrumb { position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:8px; padding:16px 20px; padding-top:40px; }
  .crumb { color:#505F76; font-size:14px; }
  .crumb.active { color:#00FFC6; font-weight:700; }
  .crumb-sep { color:#333d4d; }

  #loading { position:fixed; inset:0; z-index:20; background:#000308;
    display:flex; align-items:center; justify-content:center;
    color:#00FFC6; font-size:14px; letter-spacing:1px; transition:opacity .3s ease; }
  #loading.hide { opacity:0; pointer-events:none; }

  #toast { position:fixed; bottom:36px; left:50%; transform:translateX(-50%);
    background:rgba(21,27,43,0.95); color:#fff; padding:10px 20px; border-radius:20px;
    font-size:13px; opacity:0; transition:opacity .3s ease; z-index:15; pointer-events:none;
    white-space:nowrap; border:1px solid rgba(0,255,198,0.25); }
  #toast.show { opacity:1; }

  #pointCard { position:fixed; z-index:25; background:#151B2B; border:1px solid #00FFC6;
    border-radius:10px; padding:8px 14px; color:#fff; font-size:12px; pointer-events:none;
    transform:translate(-50%,-100%) scale(0); opacity:0; white-space:nowrap; }
  #pointCard.show { animation:bounceIn .45s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes bounceIn {
    0%   { transform:translate(-50%,-100%) scale(0);    opacity:0; }
    60%  { transform:translate(-50%,-110%) scale(1.15);  opacity:1; }
    100% { transform:translate(-50%,-100%) scale(1);     opacity:1; }
  }

  #backBtn { position:fixed; top:40px; right:20px; z-index:10; color:#00FFC6; font-size:13px;
    background:rgba(21,27,43,0.8); border:1px solid rgba(0,255,198,0.3); border-radius:16px;
    padding:8px 14px; display:none; }

  /* 模式切换时的全屏黑幕，用来盖住"两套渲染引擎互相顶替"那一瞬间的接缝 */
  #transitionVeil { position:fixed; inset:0; z-index:30; background:#000308;
    opacity:0; pointer-events:none; transition:opacity .35s ease; }
  #transitionVeil.show { opacity:1; pointer-events:all; }
</style>
</head>
<body>
  <div id="loading">加载地图数据…</div>
  <div id="globeChart"></div>
  <div id="mapChart" class="hidden"></div>
  <div id="enterHint" class="hidden">点击地球，进入中国地图</div>
  <div id="breadcrumb"></div>
  <div id="backBtn" onclick="goBack()">‹ 返回</div>
  <div id="toast"></div>
  <div id="pointCard"></div>
  <div id="transitionVeil"></div>

<script>
/**
 * ============================================================================
 * 消费足迹地图 v2 —— 3D地球 + 2D省市区县下钻，双引擎切换原型
 * ============================================================================
 * 参照两个GitHub项目的思路做的混合方案：
 * - 缩小到"地球"层级：仿 MuGuiLin/3D-Earth 的路子，用 echarts-gl 的 globe
 *   组件做自动旋转的3D地球，视觉上追求"谷歌地球"那种炫酷感
 * - 放大到"国家/省/市/县"层级：沿用 TangSY/echarts-map-demo 的思路，纯2D
 *   ECharts map + 阿里DataV边界数据做多级联动下钻，比3D渲染省资源、交互精确
 *
 * 【关于卡顿】3D地球（WebGL）和2D地图是完全独立的两个 ECharts 实例、两个
 * <div> 容器，切换模式时把不用的那个整个隐藏+dispose，不会出现"两套渲染
 * 同时跑"的情况——这是这一版专门针对"不要卡顿"这个要求做的架构选择。
 * 但WebView里WebGL性能天然弱于桌面浏览器，具体流不流畅、地球材质贴图能不能
 * 正常加载，还是需要你在真机上实测确认，这个我这边没法模拟验证。
 *
 * 当前仍然是纯前端假数据原型，只验证"地球⇄平面地图"这个双模式切换的观感，
 * 不接真实消费数据。
 * ============================================================================
 */

const DATAV_BASE = 'https://geo.datav.aliyun.com/areas_v3/bound/';
// echarts-gl 官方demo自带的地球贴图资源，用 jsdelivr 代理直接引用，不用自己找图床
const EARTH_TEXTURE = 'https://cdn.jsdelivr.net/gh/ecomfe/echarts-gl/test/asset/earth.jpg';
const STARFIELD_TEXTURE = 'https://cdn.jsdelivr.net/gh/ecomfe/echarts-gl/test/asset/starfield.jpg';
const CHINA_CENTER_LNGLAT = [104.0, 35.0]; // 中国大致几何中心，地球模式的默认落点

// ============================================================================
// 占位假数据区（最后会替换成真实消费记录）
// ============================================================================
const DEMO_PROVINCE_DATA = [
  { name: '广东省', adcode: 440000, percent: 32 },
  { name: '浙江省', adcode: 330000, percent: 18 },
  { name: '江苏省', adcode: 320000, percent: 15 },
  { name: '四川省', adcode: 510000, percent: 12 },
  { name: '北京市', adcode: 110000, percent: 10 },
  { name: '上海市', adcode: 310000, percent: 8 },
  { name: '福建省', adcode: 350000, percent: 5 },
];

// 城市下面再加一级"区县"，key 是市名
const DEMO_DISTRICTS = {
  '深圳市': [{ name: '南山区', adcode: 440305 }, { name: '福田区', adcode: 440304 }],
  '广州市': [{ name: '天河区', adcode: 440106 }],
  '杭州市': [{ name: '西湖区', adcode: 330106 }],
};

const DEMO_POINTS = {
  '广东省': [
    { name: '示例·深圳湾体育中心', city: '深圳市', cityAdcode: 440300, district: '南山区', lng: 113.9455, lat: 22.5232 },
    { name: '示例·广州塔',       city: '广州市', cityAdcode: 440100, district: '天河区', lng: 113.3245, lat: 23.1066 },
    { name: '示例·珠海长隆',     city: '珠海市', cityAdcode: 440400, district: null,     lng: 113.5767, lat: 22.1155 },
  ],
  '浙江省': [
    { name: '示例·西湖',   city: '杭州市', cityAdcode: 330100, district: '西湖区', lng: 120.1551, lat: 30.2489 },
    { name: '示例·乌镇',   city: '嘉兴市', cityAdcode: 330400, district: null,     lng: 120.4970, lat: 30.7469 },
  ],
  '北京市': [
    { name: '示例·三里屯', city: '北京市', cityAdcode: 110100, district: null, lng: 116.4551, lat: 39.9368 },
  ],
};

const PALETTE = ['#00FFC6','#FF6B9D','#FFC145','#5B8DEF','#9D65FF','#FF8A5B','#4ECDC4','#F7B801','#7BDFF2','#B892FF'];
// ============================================================================

const globeChart = echarts.init(document.getElementById('globeChart'));
const mapChart = echarts.init(document.getElementById('mapChart'));
const globeEl = document.getElementById('globeChart');
const mapEl = document.getElementById('mapChart');
const enterHintEl = document.getElementById('enterHint');
const loadingEl = document.getElementById('loading');
const breadcrumbEl = document.getElementById('breadcrumb');
const toastEl = document.getElementById('toast');
const pointCardEl = document.getElementById('pointCard');
const backBtnEl = document.getElementById('backBtn');
const veilEl = document.getElementById('transitionVeil');

const geoCache = {};
let state = { mode: 'globe', level: 'country', provinceName: null, provinceAdcode: null,
  cityName: null, cityAdcode: null, districtName: null };

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function setLoading(show) { loadingEl.classList.toggle('hide', !show); }

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function showPointCard(name, x, y) {
  pointCardEl.textContent = name;
  pointCardEl.style.left = x + 'px';
  pointCardEl.style.top = y + 'px';
  pointCardEl.classList.remove('show');
  void pointCardEl.offsetWidth;
  pointCardEl.classList.add('show');
  clearTimeout(showPointCard._t);
  showPointCard._t = setTimeout(() => pointCardEl.classList.remove('show'), 2200);
}

async function fetchGeo(adcode) {
  if (geoCache[adcode]) return geoCache[adcode];
  const resp = await fetch(DATAV_BASE + adcode + '_full.json');
  if (!resp.ok) throw new Error('地图数据请求失败: ' + adcode);
  const json = await resp.json();
  geoCache[adcode] = json;
  return json;
}

async function withVeil(fn) {
  veilEl.classList.add('show');
  await sleep(200);
  await fn();
  await sleep(60);
  veilEl.classList.remove('show');
}

// ============================================================================
// 地球层（仿 3D-Earth 思路）：echarts-gl globe，自动旋转 + 中国热点
// ============================================================================
function initGlobe() {
  globeChart.setOption({
    backgroundColor: '#000308',
    globe: {
      baseTexture: EARTH_TEXTURE,
      environment: STARFIELD_TEXTURE,
      shading: 'realistic',
      displacementScale: 0.02,
      atmosphere: { show: true, offset: 5, glowPower: 4, innerGlowPower: 2, color: '#7fd8ff' },
      light: {
        ambient: { intensity: 0.35 },
        main: { intensity: 1.1, shadow: false },
      },
      viewControl: {
        autoRotate: true,
        autoRotateSpeed: 6,       // 转速温和一点，太快在WebView里容易看着卡
        autoRotateAfterStill: 2,
        distance: 210,
        alpha: 22,
        panSensitivity: 0,        // 不给平移，只留旋转缩放，防止误触把地球拖丢
      },
    },
    series: [{
      type: 'scatter3D',
      coordinateSystem: 'globe',
      symbolSize: 14,
      itemStyle: { color: '#00FFC6', opacity: 0.9 },
      data: [{ name: '中国', value: [...CHINA_CENTER_LNGLAT, 0] }],
    }],
  }, true);

  setLoading(false);
  enterHintEl.classList.remove('hidden');
}

/** 点地球上的中国点 → 镜头先往中国推近，做出"俯冲下去"的观感，再切换成平面地图 */
async function enterMapModeFromGlobe() {
  if (state.mode !== 'globe') return;
  showToast('进入中国地图…');
  enterHintEl.classList.add('hidden');

  globeChart.setOption({
    globe: {
      viewControl: {
        autoRotate: false,
        distance: 130,
        alpha: 45,
        targetCoord: CHINA_CENTER_LNGLAT,
        animation: true,
        animationDurationUpdate: 900,
        animationEasingUpdate: 'cubicIn',
      },
    },
  });
  await sleep(750);

  await withVeil(async () => {
    globeEl.classList.add('hidden');
    mapEl.classList.remove('hidden');
    state.mode = 'map';
    await renderCountry();
  });
}

/** 从平面地图退回地球：反向动画，先淡出地图，切回地球后镜头从近拉远 */
async function exitToGlobeMode() {
  if (state.mode !== 'map') return;
  await withVeil(async () => {
    mapEl.classList.add('hidden');
    globeEl.classList.remove('hidden');
    state.mode = 'globe';
    state.level = 'country';
    renderBreadcrumb();

    globeChart.setOption({
      globe: {
        viewControl: {
          autoRotate: false, distance: 130, alpha: 45,
          targetCoord: CHINA_CENTER_LNGLAT, animation: false,
        },
      },
    });
  });

  await sleep(80);
  globeChart.setOption({
    globe: {
      viewControl: {
        distance: 210, alpha: 22, autoRotate: true,
        animation: true, animationDurationUpdate: 900, animationEasingUpdate: 'cubicOut',
      },
    },
  });
  enterHintEl.classList.remove('hidden');
}

globeChart.on('click', params => {
  if (state.mode === 'globe') enterMapModeFromGlobe();
});

// ============================================================================
// 平面地图层（仿 echarts-map-demo 思路）：全国 → 省 → 市 → 区县
// ============================================================================
function renderBreadcrumb() {
  if (state.mode === 'globe') { breadcrumbEl.innerHTML = ''; backBtnEl.style.display = 'none'; return; }
  let html = `<span class="crumb${state.level==='country'?' active':''}" onclick="goToCountry()">全国</span>`;
  if (state.provinceName) {
    html += `<span class="crumb-sep">›</span><span class="crumb${state.level==='province'?' active':''}" onclick="goToProvince()">${state.provinceName}</span>`;
  }
  if (state.cityName) {
    html += `<span class="crumb-sep">›</span><span class="crumb${state.level==='city'?' active':''}" onclick="goToCity()">${state.cityName}</span>`;
  }
  if (state.districtName) {
    html += `<span class="crumb-sep">›</span><span class="crumb active">${state.districtName}</span>`;
  }
  breadcrumbEl.innerHTML = html;
  backBtnEl.style.display = 'block'; // 地图模式下始终显示，点到头（全国）会退回地球
}

async function renderCountry() {
  setLoading(true);
  state = { mode: 'map', level: 'country', provinceName: null, provinceAdcode: null,
    cityName: null, cityAdcode: null, districtName: null };
  renderBreadcrumb();

  const china = await fetchGeo(100000);
  echarts.registerMap('china', china);

  const percentMap = {};
  DEMO_PROVINCE_DATA.forEach(p => percentMap[p.name] = p.percent);

  const data = china.features.map((f, i) => ({
    name: f.properties.name,
    value: percentMap[f.properties.name] || 0,
    center: f.properties.center,
    itemStyle: { areaColor: PALETTE[i % PALETTE.length] },
  }));

  mapChart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: p => (p.data && p.data.value) ? `${p.name}<br/>消费占比 ${p.data.value}%` : `${p.name}<br/>暂无记录`,
      backgroundColor: 'rgba(10,14,23,0.92)', borderColor: '#00FFC6', textStyle: { color: '#fff', fontSize: 12 },
    },
    geo: null,
    series: [{
      type: 'map', map: 'china', roam: true, zoom: 1, label: { show: false },
      itemStyle: { borderColor: '#0A0E17', borderWidth: 1 },
      emphasis: { label: { show: true, color: '#fff', fontSize: 12 },
        itemStyle: { shadowBlur: 20, shadowColor: 'rgba(0,255,198,0.6)' } },
      data,
    }],
    animationDurationUpdate: 500, animationEasingUpdate: 'cubicOut',
  }, true);

  setLoading(false);
}

async function renderPointsLayer(mapKey, geo, points) {
  echarts.registerMap(mapKey, geo);
  mapChart.setOption({
    backgroundColor: 'transparent',
    tooltip: { show: false },
    geo: {
      map: mapKey, roam: true,
      itemStyle: { areaColor: 'rgba(0,255,198,0.07)', borderColor: 'rgba(0,255,198,0.35)', borderWidth: 1 },
      emphasis: { itemStyle: { areaColor: 'rgba(0,255,198,0.16)' } },
    },
    series: [{
      type: 'effectScatter', coordinateSystem: 'geo', symbolSize: 12,
      rippleEffect: { brushType: 'stroke', scale: 3.2, period: 3 },
      itemStyle: { color: '#00FFC6', shadowBlur: 10, shadowColor: '#00FFC6' },
      label: { show: true, position: 'top', formatter: p => p.data.name, color: '#fff', fontSize: 11, distance: 8 },
      data: points.map(pt => ({ name: pt.name, value: [pt.lng, pt.lat] })),
    }],
    animationDurationUpdate: 500, animationEasingUpdate: 'cubicOut',
  }, true);
}

async function drillIntoProvince(name, adcode, center) {
  showToast('正在进入 ' + name + '…');
  if (center) mapChart.dispatchAction({ type: 'geoRoam', componentType: 'series', seriesIndex: 0, zoom: 5, center });
  const geoPromise = fetchGeo(adcode);
  await sleep(480);
  const geo = await geoPromise;

  state.level = 'province'; state.provinceName = name; state.provinceAdcode = adcode;
  state.cityName = null; state.cityAdcode = null; state.districtName = null;
  renderBreadcrumb();
  setLoading(false);
  await renderPointsLayer('region_' + adcode, geo, DEMO_POINTS[name] || []);
}

async function drillIntoCity(cityName, cityAdcode, cityCenter) {
  if (cityCenter) mapChart.dispatchAction({ type: 'geoRoam', componentType: 'geo', zoom: 3, center: cityCenter });
  await sleep(420);

  state.level = 'city'; state.cityName = cityName; state.cityAdcode = cityAdcode; state.districtName = null;
  renderBreadcrumb();
  const points = (DEMO_POINTS[state.provinceName] || []).filter(pt => pt.city === cityName);
  await renderPointsLayer('region_' + state.provinceAdcode, geoCache[state.provinceAdcode], points);
}

/** 区县层：demo阶段不下钻加载真实区县边界，直接在当前市级地图基础上把镜头拉得更近，
 *  只展示该区县下的点——省一次GeoJSON请求，效果上仍然是"再下钻一层"的观感 */
async function drillIntoDistrict(districtName) {
  state.level = 'district'; state.districtName = districtName;
  renderBreadcrumb();
  const points = (DEMO_POINTS[state.provinceName] || [])
    .filter(pt => pt.city === state.cityName && pt.district === districtName);
  showToast(districtName + '（' + points.length + '条记录）');
  if (points.length) mapChart.dispatchAction({ type: 'geoRoam', componentType: 'geo', zoom: 6, center: [points[0].lng, points[0].lat] });
}

function goToCountry() { if (state.mode === 'map' && state.level !== 'country') renderCountry(); }
function goToProvince() { if (state.level === 'city' || state.level === 'district') drillIntoProvince(state.provinceName, state.provinceAdcode); }
function goToCity() { if (state.level === 'district') drillIntoCity(state.cityName, state.cityAdcode); }

function goBack() {
  if (state.mode === 'globe') return;
  if (state.level === 'district') goToCity();
  else if (state.level === 'city') goToProvince();
  else if (state.level === 'province') goToCountry();
  else if (state.level === 'country') exitToGlobeMode(); // 全国层再退一步，回到地球
}

mapChart.on('click', params => {
  if (params.componentType === 'series' && params.seriesType === 'effectScatter') {
    const evt = params.event && params.event.event;
    showPointCard(params.data.name, evt ? evt.offsetX : innerWidth/2, evt ? evt.offsetY : innerHeight/2);
    return;
  }
  if (state.level === 'country') {
    const target = DEMO_PROVINCE_DATA.find(p => p.name === params.name);
    if (!target) { showToast(params.name + ' 暂无记录'); return; }
    drillIntoProvince(target.name, target.adcode, params.data && params.data.center);
    return;
  }
  if (state.level === 'province') {
    const clickedAdcode = params.data && params.data.adcode;
    const hit = (DEMO_POINTS[state.provinceName] || []).find(pt => pt.city === params.name);
    if (!hit) { showToast(params.name + ' 暂无记录'); return; }
    drillIntoCity(params.name, clickedAdcode || hit.cityAdcode, params.data && params.data.center);
    return;
  }
  if (state.level === 'city') {
    const districts = DEMO_DISTRICTS[state.cityName] || [];
    const hit = districts.find(d => d.name === params.name);
    if (!hit) { showToast(params.name + ' 暂无记录'); return; }
    drillIntoDistrict(hit.name);
  }
});

window.addEventListener('resize', () => { globeChart.resize(); mapChart.resize(); });

initGlobe();
</script>
</body>
</html>
